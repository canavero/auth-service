apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
type: Opaque
stringData: # valores de DESENVOLVIMENTO; k8s/deploy.sh sobrescreve com os reais
  JWT_SECRET_KEY: EBwrdOOcAIDRLON9hbJV0+O3PTdfTjgMCQIxwLH7ws8=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-configmap
data:
  JWT_DURATION: "3600000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      enableServiceLinks: false # sem isso o k8s injeta REDIS_PORT=tcp://<ip>:6379 (Service "redis") e quebra o Spring
      containers:
        - name: auth
          image: DOCKERHUB_USER/auth-service:latest
          imagePullPolicy: IfNotPresent # CI faz deploy com tag imutável :<sha>; evita o limite de pulls do Docker Hub
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-configmap
            - secretRef:
                name: auth-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /auth/actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36 # até 3 min para a JVM subir
          livenessProbe:
            httpGet:
              path: /auth/actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /auth/actuator/health/readiness
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
